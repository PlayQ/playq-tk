redis {
  endpoint = "redis://localhost:6379" // for cluster/replicated mode multiple endpoints should be coma separated: "redis://node2:6379,redis://node1:6379"
  integrationCheck = false // check Redis connection on service startup (if Redis is down service will be terminated instantly)
  serverMode = "SINGLE" // SINGLE, REPLICATED or CLUSTER; Elasticache suports REPLICATED or CLUSTER modes.
  authMode = "AWS_IAM" // AWS_IAM or PASS or PUBLIC
  user = "" // user for PASS mode
  password = "" // pass for PASS mode
  awsUserId = "user" // awsUserId for AWS_IAM mode
  awsReplicationGroupId = "replication_group"  // awsReplicationGroupId for AWS_IAM mode
  awsRegion = "us-east-1" // awsReplicationGroupId for AWS_IAM mode
}