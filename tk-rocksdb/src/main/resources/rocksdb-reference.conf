rocksdb {
  createIfMissing = true
  writeBufferSize = 60000000
  paranoidChecks = false
  paranoidFileChecks = false
  enablePipelinedWrite = true
  maxWriteBufferNumber = 10
  minWriteBufferNumberToMerge = 5
  maxBackgroundJobs = 32
  maxOpenFiles = 20
  flushInterval = "1 minute"
  defaultBaseDir = "/tmp/"
}
