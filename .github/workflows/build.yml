name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'vuepress/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set BRANCH_TAG
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "BRANCH_TAG=$tag" >> "$GITHUB_ENV"

      - name: Generate build.sbt
        run: nix develop --command ./sbtgen.sh

      - name: Build, Test and Publish
        env:
          OPENSSL_IV: ${{ secrets.OPENSSL_IV }}
          OPENSSL_KEY: ${{ secrets.OPENSSL_KEY }}
        run: |
          COMMAND="+clean +test"
          if [[ -n "${OPENSSL_KEY}" ]] && { [[ "$GITHUB_REF" == "refs/heads/develop" ]] || [[ "$BRANCH_TAG" =~ ^v.*$ ]]; }; then
            openssl aes-256-cbc -K "${OPENSSL_KEY}" -iv "${OPENSSL_IV}" -in secrets.tar.enc -out secrets.tar -d
            tar xvf secrets.tar
            ln -sf .secrets/local.sbt local.sbt
            COMMAND="$COMMAND +publishSigned"
            if [[ "$BRANCH_TAG" =~ ^v.*$ ]]; then
              COMMAND="$COMMAND sonatypeBundleRelease"
            fi
          fi
          echo "sbt $COMMAND"
          nix develop --command sbt -no-colors "$COMMAND"

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/test-reports/junit/TEST-*.xml'
